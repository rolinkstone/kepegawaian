# ============================================================================
#  Docker Compose - Aplikasi Kepegawaian
# ============================================================================
#  !! FILE INI TIDAK BOLEH BERISI PASSWORD / SECRET APA PUN !!
#
#  SEMUA konfigurasi & kredensial dibaca dari SATU file di root project:
#
#      .env        <- di-ignore git, JANGAN di-commit
#      .env.example <- template yang aman di-commit
#
#  Deploy / rebuild di server:
#      1. cp .env.example .env
#      2. nano .env            # isi semua nilai
#      3. chmod 600 .env
#      4. docker compose config        # cek konfigurasi
#      5. docker compose up -d --build
#
#  Kalau ada nilai yang belum diisi, langkah 4 akan berhenti dengan pesan
#  yang menyebutkan nama variabelnya - jadi tidak perlu menebak.
#
#  Catatan: NEXT_PUBLIC_* BUKAN rahasia (ikut ter-bundle ke browser), tapi
#  wajib diisi karena ditanam saat build time.
# ============================================================================

services:
  backend:
    build: ./backend
    container_name: tambunraya-backend
    restart: unless-stopped
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 1.1.1.1

    environment:
      # --- runtime ---
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-5001}
      - DATA_PATH=/data
      - LOGS_PATH=/data/logs
      - UPLOADS_PATH=/data/uploads

      # --- database ---
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:?DB_USER belum diisi di .env}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD belum diisi di .env}
      - DB_NAME=${DB_NAME:-kepegawaian}

      # --- keycloak ---
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL:?KEYCLOAK_SERVER_URL belum diisi di .env}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-master}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME belum diisi di .env}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD belum diisi di .env}
      # Backend memakai client Keycloak miliknya sendiri
      - KEYCLOAK_CLIENT_ID=${BACKEND_KEYCLOAK_CLIENT_ID:?BACKEND_KEYCLOAK_CLIENT_ID belum diisi di .env}
      - KEYCLOAK_CLIENT_SECRET=${BACKEND_KEYCLOAK_CLIENT_SECRET:?BACKEND_KEYCLOAK_CLIENT_SECRET belum diisi di .env}

      # --- url & session ---
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL belum diisi di .env}
      - BACKEND_URL=${BACKEND_URL:?BACKEND_URL belum diisi di .env}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET belum diisi di .env}
      - ALLOW_TESTING_FALLBACK=${ALLOW_TESTING_FALLBACK:-false}

    volumes:
      - ./data/backend:/data
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* ditanam saat build time - bukan nilai rahasia
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL belum diisi di .env}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${NEXT_PUBLIC_KEYCLOAK_ISSUER:?NEXT_PUBLIC_KEYCLOAK_ISSUER belum diisi di .env}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:?NEXT_PUBLIC_KEYCLOAK_CLIENT_ID belum diisi di .env}
    container_name: tambunraya-frontend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${FRONTEND_PORT:-3002}:3002"

    environment:
      # --- runtime ---
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - DATA_PATH=/data
      - CACHE_PATH=/data/.next/cache
      - PUBLIC_UPLOADS_PATH=/data/public/uploads

      # --- NextAuth ---
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL belum diisi di .env}
      - NEXTAUTH_URL_INTERNAL=http://localhost:3002
      - NEXTAUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET belum diisi di .env}

      # --- Keycloak (dipakai NextAuth di sisi server) ---
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:?KEYCLOAK_ISSUER belum diisi di .env}
      # Frontend memakai client Keycloak yang berbeda dari backend
      - KEYCLOAK_CLIENT_ID=${FRONTEND_KEYCLOAK_CLIENT_ID:?FRONTEND_KEYCLOAK_CLIENT_ID belum diisi di .env}
      - KEYCLOAK_CLIENT_SECRET=${FRONTEND_KEYCLOAK_CLIENT_SECRET:?FRONTEND_KEYCLOAK_CLIENT_SECRET belum diisi di .env}

      # --- publik, ikut ter-bundle ke browser ---
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL belum diisi di .env}
      - NEXT_PUBLIC_KEYCLOAK_ISSUER=${NEXT_PUBLIC_KEYCLOAK_ISSUER:?NEXT_PUBLIC_KEYCLOAK_ISSUER belum diisi di .env}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:?NEXT_PUBLIC_KEYCLOAK_CLIENT_ID belum diisi di .env}

      # --- Keycloak admin (dipakai script admin bila ada) ---
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-}

    volumes:
      - ./data/frontend:/data
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    depends_on:
      - backend