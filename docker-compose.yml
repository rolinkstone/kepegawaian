# ============================================================================
#  Docker Compose - Aplikasi Kepegawaian
# ============================================================================
#  !! FILE INI TIDAK BOLEH BERISI PASSWORD / SECRET APA PUN !!            
#  File ini ikut ter-commit ke git. Semua kredensial disimpan di file
#  terpisah yang sudah di-ignore git:
#
#     backend/.env    -> kredensial DB, Keycloak, session
#     frontend/.env   -> kredensial Keycloak & NextAuth
#
#  Template-nya ada di backend/.env.example dan frontend/.env.example
#
#  Deploy / rebuild di server:
#    1. cp backend/.env.example  backend/.env    && nano backend/.env
#    2. cp frontend/.env.example frontend/.env   && nano frontend/.env
#    3. docker compose config          # cek konfigurasi
#    4. docker compose up -d --build
#
#  Catatan: nilai NEXT_PUBLIC_* di bawah BUKAN rahasia (ikut ter-bundle ke
#  browser). Nilainya bisa ditimpa lewat file .env di root project ini.
# ============================================================================

services:
  backend:
    build: ./backend
    container_name: tambunraya-backend
    restart: unless-stopped
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 1.1.1.1

    # Seluruh kredensial dibaca dari file .env (tidak ikut ke git)
    env_file:
      - ./backend/.env

    # Nilai di bawah hanya konfigurasi non-rahasia; menimpa isi env_file
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-5001}
      - DATA_PATH=/data
      - LOGS_PATH=/data/logs
      - UPLOADS_PATH=/data/uploads

    volumes:
      - ./data/backend:/data
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* ditanam saat build time - bukan nilai rahasia
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-tambun.bbpompky.id/api}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${NEXT_PUBLIC_KEYCLOAK_ISSUER:-https://auth.bbpompky.id/realms/master}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-kepegawaian}
    container_name: tambunraya-frontend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${FRONTEND_PORT:-3002}:3002"

    # Seluruh kredensial NextAuth & Keycloak dibaca dari file .env
    env_file:
      - ./frontend/.env

    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - DATA_PATH=/data
      - CACHE_PATH=/data/.next/cache
      - PUBLIC_UPLOADS_PATH=/data/public/uploads

    volumes:
      - ./data/frontend:/data
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    depends_on:
      - backend